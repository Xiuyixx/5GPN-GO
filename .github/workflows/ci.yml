# M0 CI — most steps use "|| true" while internals are stubs.
# M1 will remove the trailing "|| true" and enforce real gating.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        go: ["1.22", "1.23"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: tidy
        run: go mod tidy || true
      - name: vet
        run: go vet ./... || true
      - name: build
        run: go build ./cmd/... || true
      - name: test
        run: go test -race -coverprofile=cover.out ./... || true
      - name: upload-coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-go${{ matrix.go }}
          path: cover.out
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci --ignore-scripts || true
      - name: lint
        working-directory: web
        run: npm run lint || true
      - name: build
        working-directory: web
        run: npm run build || true

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
        continue-on-error: true
