# CI gates enforced for every push to main + every PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        go: ["1.25"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: tidy
        run: go mod tidy
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./cmd/...
      - name: test
        run: go test -race -coverprofile=cover.out -timeout=8m ./...
      - name: upload-coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-go${{ matrix.go }}
          path: cover.out
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci --ignore-scripts || true
      - name: lint
        working-directory: web
        run: npm run lint || true
      - name: build
        working-directory: web
        run: npm run build || true

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
        continue-on-error: true

  # M4 file-size guard. Any non-test .go file under internal/ over
  # 800 lines fails the pipeline; see scripts/check-file-size.sh and
  # docs/tech-debt.md.
  size-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: file-size guard
        run: ./scripts/check-file-size.sh --tree

  # M4 e2e smoke suite. Boots the real daemon on a random port and walks
  # bootstrap → login → protected endpoint. Files are behind a build tag
  # so dev machines skip them; CI runs them explicitly here.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: build daemon
        run: go build -o dist/5gpn ./cmd/5gpn
      - name: run smoke
        env:
          E2E_BINARY: ${{ github.workspace }}/dist/5gpn
        run: go test -tags e2e -count=1 -timeout=2m ./tests/e2e/...

  # S1 guard: internal/rules must never import internal/config.
  # Prevents accidental import cycles on the config→rules unidirectional boundary.
  dep-cycle-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: config→rules dep-cycle guard
        run: make dep-cycle-check

  # Preview installer behavior against every supported distro fixture
  # without provisioning real VMs. Every fixture must yield `install: ok`
  # in dry-run mode. If you add a fixture, extend the matrix + the
  # osdetect_test.go table together.
  installer-fixtures:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - ubuntu-22.04
          - ubuntu-24.04
          - debian-12
          - debian-13
          - centos-9
          - almalinux-9
          - rocky-9
          - rhel-9
          - fedora-40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: dry-run install for ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          go run ./cmd/5gpn-installer install \
            --dry-run \
            --root /tmp/5gpn-preview \
            --skip-enable \
            --os-fixture internal/installer/testdata/os-release/${{ matrix.fixture }} \
            | tee /tmp/preview.log
          grep -q '^install: ok$' /tmp/preview.log
          grep -q '^distro:' /tmp/preview.log
      - name: doctor for ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          go run ./cmd/5gpn-installer doctor \
            --os-fixture internal/installer/testdata/os-release/${{ matrix.fixture }} \
            || true # doctor may FAIL bin-dir-writable in the GH runner sandbox; we only need the distro check
