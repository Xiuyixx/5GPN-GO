run:
  timeout: 5m
  tests: true
  build-tags:
    - embed

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosimple
    - ineffassign
    - unused
    - revive
    - funlen
    - gocognit
    - nestif

linters-settings:
  funlen:
    lines: 80
    statements: 60
  gocognit:
    min-complexity: 20
  nestif:
    min-complexity: 5

issues:
  exclude-dirs:
    - 5GPN-X
    - catalyst-ui-kit
    - .omc
    - web
    - testdata
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - gocognit
